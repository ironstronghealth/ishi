name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, aakash1454-dev ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Flutter clean
        working-directory: mobile
        run: flutter clean

      - name: Set SDK levels in local.properties
        working-directory: mobile/android
        run: |
          sed -i '/^flutter.compileSdkVersion/d' local.properties || true
          sed -i '/^flutter.targetSdkVersion/d'  local.properties || true
          sed -i '/^flutter.minSdkVersion/d'     local.properties || true
          echo "flutter.compileSdkVersion=35" >> local.properties
          echo "flutter.targetSdkVersion=35"  >> local.properties
          echo "flutter.minSdkVersion=21"     >> local.properties
          echo "local.properties ----"
          cat local.properties

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Restore & verify keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          # Decode base64 (only strip whitespace/newlines; do NOT filter characters)
          python3 - <<'PY'
          import os, base64, pathlib
          b64 = os.environ['ANDROID_KEYSTORE_BASE64'].strip()
          b64 = "".join(b64.split())  # remove whitespace/newlines
          out = pathlib.Path.home() / 'ishi_upload.jks'
          out.write_bytes(base64.b64decode(b64))
          print("Wrote:", out, "bytes:", out.stat().st_size)
          PY

          ls -lh "$HOME/ishi_upload.jks"
          echo "Runner sha256:"
          sha256sum "$HOME/ishi_upload.jks"

          # Write Gradle signing config
          {
            echo "storeFile=$HOME/ishi_upload.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > mobile/android/key.properties
          echo "---- key.properties ----"
          cat mobile/android/key.properties

          echo "Verify with JKS..."
          if keytool -list \
               -keystore "$HOME/ishi_upload.jks" \
               -storetype JKS \
               -alias "$ANDROID_KEY_ALIAS" \
               -storepass "$ANDROID_KEYSTORE_PASSWORD" \
               -keypass "$ANDROID_KEY_PASSWORD" ; then
            echo "JKS verify OK"
          else
            echo "JKS verify failed; trying PKCS12..."
            keytool -list \
               -keystore "$HOME/ishi_upload.jks" \
               -storetype PKCS12 \
               -storepass "$ANDROID_KEYSTORE_PASSWORD" || exit 1
            echo "PKCS12 verify OK"
          fi


      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android platforms & build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-31"

      - name: Install Android NDK 27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Generate launcher icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons

      - name: Generate native splash
        working-directory: mobile
        run: flutter pub run flutter_native_splash:create

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://ishi-api.onrender.com \
            --dart-define=MIN_APP_VERSION=1.0.0 \
            --dart-define=APP_STORE_URL=https://ironstronginitiative.com/app

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
          retention-days: 14

      - name: Build release AAB
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://ishi-api.onrender.com \
            --dart-define=MIN_APP_VERSION=1.0.0 \
            --dart-define=APP_STORE_URL=https://ironstronginitiative.com/app

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          overwrite: true
          retention-days: 14
